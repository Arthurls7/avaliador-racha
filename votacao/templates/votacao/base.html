<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Racha{% endblock %} · Avaliações</title>
  <style>
    :root {
      --verde: #1f7a4d; --verde-claro: #e7f4ec; --fundo: #f3f5f4; --borda: #dbe2de;
      --texto: #1c2420; --suave: #5d6a63; --erro: #b3261e; --erro-claro: #fdecea; --aviso-claro: #fff6dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: var(--texto); background: var(--fundo); line-height: 1.45; }
    header { background: var(--verde); padding: 14px 16px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.15rem; }
    main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
    h1 { font-size: 1.45rem; margin: 6px 0 4px; }
    h2 { font-size: 1.1rem; margin: 0 0 10px; }
    a { color: var(--verde); }
    .suave { color: var(--suave); }
    .pequeno { font-size: .875rem; }
    .voltar { display: inline-block; margin-bottom: 6px; font-size: .95rem; }
    .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin: 14px 0; }
    .msg { padding: 10px 14px; border-radius: 10px; margin: 10px 0; }
    .msg.success { background: var(--verde-claro); }
    .msg.error { background: var(--erro-claro); color: var(--erro); }
    .msg.info { background: var(--aviso-claro); }
    .botao { display: inline-block; border: 1px solid var(--verde); border-radius: 10px; padding: 11px 18px;
             font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--verde); color: #fff; }
    .botao:disabled { opacity: .4; cursor: not-allowed; }
    .botao.secundario { background: #fff; color: var(--verde); }
    .botao.perigo { background: var(--erro); border-color: var(--erro); }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
    .pessoa { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 14px;
              background: #fff; border: 1px solid var(--borda); border-radius: 12px; color: var(--texto);
              text-decoration: none; font-weight: 600; }
    .pessoa:hover, a.opcao:hover { border-color: var(--verde); }
    .ok { color: var(--verde); font-weight: 700; }
    a.opcao { display: block; color: var(--texto); text-decoration: none; }
    a.opcao p { margin: 0; color: var(--suave); }
    label { display: block; font-weight: 600; margin-bottom: 12px; }
    input[type=text], input[type=password], textarea, select {
      font: inherit; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; }
    label input, textarea { display: block; width: 100%; margin-top: 4px; }
    .tabela-rolagem { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
    th { font-size: .85rem; color: var(--suave); font-weight: 600; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    code { background: #eef1ef; padding: 2px 5px; border-radius: 5px; }
    footer { margin-top: 32px; text-align: center; font-size: .9rem; }
    {% block estilo %}{% endblock %}
  </style>
</head>
<body>
  <header><a href="{% url 'votacao:inicio' %}">⚽ Racha · Avaliações</a></header>
  <main>
    {% for mensagem in messages %}<div class="msg {{ mensagem.tags }}">{{ mensagem }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
