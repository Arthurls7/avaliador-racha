<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b9254">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <title>{% block titulo %}Início{% endblock %} · Racha do Doug</title>
  <style>
    :root {
      --verde: #2b9254; --verde-escuro: #1d6e3e; --verde-claro: #e5f5ea; --amarelo: #ffcf4d;
      --fundo: #f4f7f1; --borda: #e2e9e0; --texto: #1e2a23; --suave: #64726a;
      --erro: #c0392b; --aviso-claro: #fff4d1;
      --sombra: 0 1px 2px rgba(20, 50, 30, .06), 0 4px 14px rgba(20, 50, 30, .07);
      --raio: 18px;
    }
    * { box-sizing: border-box; }
    /* ao rolar até um campo, deixa espaço para a barra fixa de "Salvar" no rodapé */
    html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 110px; }
    body { margin: 0; color: var(--texto); background: var(--fundo); line-height: 1.45;
           font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* cabeçalho com listras de gramado: nome do racha + menu.
       No computador fica tudo numa linha; no celular o menu desce para a segunda linha, de ponta a ponta. */
    header { color: #fff; padding: 12px 16px 14px; border-radius: 0 0 24px 24px;
             background: repeating-linear-gradient(90deg, #2f9a5a 0 44px, #2a8d52 44px 88px);
             box-shadow: 0 4px 14px rgba(20, 60, 35, .18); }
    header .dentro { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
    header a { color: #fff; text-decoration: none; }
    /* flex-basis 0: o nome nunca empurra os botões do canto para outra linha */
    .marca { order: 1; flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .marca .nome-racha { font-size: 1.3rem; font-weight: 800; letter-spacing: .2px; line-height: 1.1; }
    .marca .nome-racha small { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .6px;
                               text-transform: uppercase; opacity: .85; }
    .bola { font-size: 1.7rem; display: inline-block; animation: quica 2.4s ease-in-out infinite; }
    @keyframes quica { 0%, 70%, 100% { transform: translateY(0) rotate(0); } 80% { transform: translateY(-6px) rotate(40deg); } }
    @media (prefers-reduced-motion: reduce) { .bola { animation: none; } }

    .menu { order: 2; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0, 40, 20, .22); }
    .menu a { padding: 8px 14px; border-radius: 999px; text-align: center; font-weight: 700; font-size: .92rem;
              white-space: nowrap; transition: background .15s; -webkit-tap-highlight-color: transparent; }
    .menu a:hover { background: rgba(255, 255, 255, .14); }
    .menu a.ativa { background: #fff; color: var(--verde-escuro); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
    .acoes-topo { order: 3; display: flex; gap: 6px; }
    .acoes-topo form { margin: 0; }
    .botao-topo { display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 14px; border: 0;
                  border-radius: 999px; background: rgba(0, 40, 20, .22); color: #fff; font: inherit; font-weight: 700;
                  cursor: pointer; }
    .botao-topo:hover { background: rgba(255, 255, 255, .2); }
    a.botao-topo { padding: 0; width: 40px; }
    /* bolinha amarela com quantos pedidos de troca estão esperando (menu do painel) */
    .contador-menu { display: inline-grid; place-items: center; min-width: 1.35em; height: 1.35em; padding: 0 .3em;
                     margin-left: 4px; border-radius: 999px; background: var(--amarelo); color: var(--texto);
                     font-size: .75rem; font-weight: 800; vertical-align: 1px; }
    @media (max-width: 640px) {
      .menu { order: 4; flex: 1 1 100%; }
      .menu a { flex: 1 1 auto; padding: 9px 4px; }
    }
    /* computador: nome numa linha só; abas um pouco mais justas para caberem ao lado */
    @media (min-width: 641px) {
      .marca { flex: 0 0 auto; margin-right: auto; }
      .marca .nome-racha { white-space: nowrap; }
      .menu a { padding: 8px 11px; }
    }
    /* o painel tem 4 abas: em tela estreita os emojis do menu somem para caber */
    @media (max-width: 440px) { .menu.cheio .emoji { display: none; } }
    @media (max-width: 360px) {
      .marca .nome-racha { font-size: 1.12rem; }
      .bola { font-size: 1.45rem; }
      .menu a { font-size: .85rem; }
    }

    main { max-width: 760px; margin: 0 auto; padding: 4px 16px 56px; }
    h1 { font-size: 1.55rem; margin: 18px 0 4px; line-height: 1.2; }
    h2 { font-size: 1.12rem; margin: 0 0 10px; }
    a { color: var(--verde-escuro); }
    .suave { color: var(--suave); }
    .pequeno { font-size: .875rem; }
    .centro { text-align: center; }
    .voltar { display: inline-block; margin-top: 22px; font-weight: 600; text-decoration: none; }
    /* botão com cara de link (ações que precisam de POST, como sair) */
    button.link { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--verde-escuro);
                  cursor: pointer; }

    .cartao { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px;
              margin: 14px 0; box-shadow: var(--sombra); }
    .msg { padding: 12px 16px; border-radius: 14px; margin: 16px 0 6px; font-weight: 600; position: relative; }
    .msg.success { background: var(--verde-claro); color: var(--verde-escuro); }
    .msg.error { background: #fdecea; color: var(--erro); }
    .msg.info { background: var(--aviso-claro); font-weight: 500; }

    .botao { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--verde);
             border-radius: 999px; padding: 11px 22px; font: inherit; font-weight: 700; cursor: pointer;
             text-decoration: none; background: var(--verde); color: #fff; transition: transform .1s, filter .1s; }
    .botao:hover { filter: brightness(1.06); }
    .botao:active { transform: scale(.97); }
    .botao:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .botao.secundario { background: #fff; color: var(--verde-escuro); }
    .botao.perigo { background: var(--erro); border-color: var(--erro); }
    .botao.largo { width: 100%; padding: 14px 22px; font-size: 1.05rem; }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    /* a parte transparente da barra não pode "roubar" o toque de quem está embaixo */
    .barra-fixa { position: sticky; bottom: 0; padding: 12px 0 14px; margin-top: 8px; pointer-events: none;
                  background: linear-gradient(to bottom, rgba(244, 247, 241, 0), var(--fundo) 30%); }
    .barra-fixa > * { pointer-events: auto; }

    /* avatar: foto ou círculo colorido com as iniciais */
    .avatar { --tam: 44px; width: var(--tam); height: var(--tam); border-radius: 50%; flex: none; object-fit: cover;
              display: inline-grid; place-items: center; color: #fff; font-weight: 800; font-size: calc(var(--tam) * .38);
              background: #b7c4bb; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0, 0, 0, .12); user-select: none; }
    .avatar.grande { --tam: 78px; }
    .avatar.medio { --tam: 52px; }
    .avatar.pequeno { --tam: 34px; box-shadow: 0 0 0 2px #fff; }
    .avatar.mini { --tam: 26px; box-shadow: none; }

    label { font-weight: 600; }
    input[type=text], input[type=password], textarea, select {
      font: inherit; padding: 10px 12px; border: 2px solid var(--borda); border-radius: 12px; background: #fff; color: var(--texto); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--verde); }
    .campo { display: block; margin-bottom: 14px; }
    .campo input, textarea { display: block; width: 100%; margin-top: 6px; }

    .tabela-rolagem { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    th { font-size: .8rem; color: var(--suave); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
    .num { text-align: right; white-space: nowrap; }
    code { background: #eef2ee; padding: 2px 6px; border-radius: 6px; }
    .escondido { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .opcao-check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; margin: 10px 0 14px; }
    .opcao-check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--verde); }
    .lista-pessoas { list-style: none; margin: 0; padding: 0; }
    .lista-pessoas li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--borda); }
    .lista-pessoas li:last-child { border-bottom: 0; }
    .lista-pessoas .nome { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2;
                           overflow-wrap: break-word; font-weight: 700; }
    .lista-pessoas .nome small { font-weight: 600; color: var(--suave); }
    .faixa-linha { border-top: 6px solid var(--cor); }
    .faixa-linha h2 { display: flex; align-items: center; gap: 8px; }
    .faixa-linha h2::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--cor); flex: none; }
    /* grade de fotos para escolher "quem é você" */
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; margin: 16px 0; }
    .jogador { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
               padding: 18px 8px 14px; background: #fff; border: 2px solid transparent; border-radius: var(--raio);
               box-shadow: var(--sombra); color: var(--texto); text-decoration: none; text-align: center;
               transition: transform .12s, border-color .12s; }
    .jogador:hover { border-color: var(--verde); transform: translateY(-2px); }
    .jogador:active { transform: scale(.96); }
    .jogador .nome { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .jogador .selo { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
                     display: grid; place-items: center; background: var(--verde); color: #fff; font-size: .8rem;
                     font-weight: 800; box-shadow: 0 0 0 2px #fff; }
    .vazio { text-align: center; padding: 32px 16px; }
    .vazio .grande { font-size: 3rem; }
    {% block estilo %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <div class="dentro">
      <a class="marca" href="{% url 'votacao:inicio' %}">
        <span class="bola" aria-hidden="true">⚽</span>
        <span class="nome-racha">Racha do Doug{% block subtitulo %}{% endblock %}</span>
      </a>
      {% block menu %}{% include "votacao/_menu_publico.html" %}{% endblock %}
    </div>
  </header>
  <main>
    {% for mensagem in messages %}<div class="msg {{ mensagem.tags }}">{{ mensagem }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  <script>
    // botões e formulários com data-confirmar pedem confirmação antes
    document.addEventListener("click", ev => {
      const alvo = ev.target.closest("[data-confirmar]");
      if (alvo && !confirm(alvo.dataset.confirmar)) ev.preventDefault();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
